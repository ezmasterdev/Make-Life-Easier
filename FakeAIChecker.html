<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Checker - Final Updated Version</title>
    <style>
        :root {
            --teal-exact: #14B8A6; 
            --teal-header: #115E59; 
            --purple-dot: #8B5CF6;  
            --border-light: #dfe3e8;
            --text-black: #111827;
            --text-grey: #6b7280;
        }

        body {
            background-color: #f1f4f9;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Centers the card vertically on screen */
        }

        .detector-card {
            background: white;
            width: 1000px;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 480px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* LEFT SIDE: INPUT */
        .input-section {
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            background: #fff;
            overflow: hidden;
        }

        .editor {
            flex: 1;
            padding: 15px 24px; 
            font-size: 15px;
            line-height: 1.6;
            color: #374151;
            outline: none;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* CUSTOM SCROLLBAR */
        .editor::-webkit-scrollbar { width: 8px; }
        .editor::-webkit-scrollbar-track { background: #f9fafb; }
        .editor::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
            border: 2px solid #f9fafb;
        }

        .input-footer {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #f3f4f6;
        }

        /* RIGHT SIDE: RESULTS */
        .results-section {
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .results-inner {
            flex: 1;
            padding: 20px 35px; 
        }

        .results-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--teal-header);
            margin-bottom: 12px;
        }

        .main-result-text {
            font-size: 19px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 25px;
            color: var(--text-black);
        }

        /* GAUGE */
        .gauge-wrapper {
            position: relative;
            width: 180px;
            height: 90px;
            margin: 0 auto 20px; 
        }
        .gauge-svg { width: 100%; height: 100%; }
        .gauge-bg { fill: none; stroke: #F3F4F6; stroke-width: 10; }
        .gauge-fill { fill: none; stroke: var(--teal-exact); stroke-width: 10; stroke-linecap: round; }
        .gauge-percentage {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            font-weight: 800;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            color: #4b5563;
        }
        .indicator { display: flex; align-items: center; gap: 10px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }

        .result-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }

        /* BUTTONS & LINKS */
        .btn-scan { background: #008476; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-upload { background: white; border: 1px solid var(--border-light); padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #4B5563; }
        .word-counter { margin-left: auto; font-size: 12px; color: var(--text-grey); }
        .grammarly-btn { border: 1.5px solid var(--teal-exact); color: var(--teal-header); background: white; padding: 8px 14px; border-radius: 6px; font-weight: 700; text-decoration: none; font-size: 13px; }

        /* FIXED BOTTOM LEFT LINK */
        .go-back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            text-decoration: none;
            color: var(--text-grey);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .go-back-link:hover {
            background: #e5e7eb;
            color: var(--text-black);
        }
    </style>
</head>
<body>

<div class="detector-card">
    <div class="input-section">
        <div class="editor" contenteditable="true" id="editor">--- ⚠️ ENTER YOUR CONTENT HERE THEN SCREENSHOT. ❗ ---</div>
        
        <div class="input-footer">
            <button class="btn-scan">Scan for AI</button>
            <button class="btn-upload">Upload file ↑</button>
            <div class="word-counter"><span id="word-count">0</span>/1400 words</div>
        </div>
    </div>

    <div class="results-section">
        <div class="results-inner">
            <div class="results-header">🔍 AI Detection results</div>
            <div class="main-result-text">0% of this text appears to be AI-generated <span style="color: gray; cursor: help;">ⓘ</span></div>

            <div class="gauge-wrapper">
                <svg class="gauge-svg" viewBox="0 0 120 60">
                    <path class="gauge-bg" d="M10,55 A45,45 0 0,1 110,55" />
                    <path class="gauge-fill" d="M10,55 A45,45 0 0,1 110,55" />
                </svg>
                <div class="gauge-percentage">0%</div>
            </div>

            <div class="data-list">
                <div class="data-item">
                    <div class="indicator">
                        <div class="dot" style="background: var(--purple-dot);"></div>
                        <span>Resembles AI text</span>
                    </div>
                    <strong>0%</strong>
                </div>
                <div class="data-item">
                    <div class="indicator">
                        <div class="dot" style="background: var(--teal-exact);"></div>
                        <span>No AI text patterns found</span>
                    </div>
                    <strong>100%</strong>
                </div>
            </div>
        </div>

        <div class="result-footer">
            <div style="font-size: 11px; color: #666; max-width: 180px; line-height: 1.4;">Great! Improve quality with grammar, tone, and citation checks.</div>
            <a href="#" class="grammarly-btn">Get Grammarly <span style="font-weight:400; color:var(--teal-exact)">It's free →</span></a>
        </div>
    </div>
</div>

<a href="index.html" class="go-back-link">← Go back</a>

<script>
    const editor = document.getElementById('editor');
    const wordCountDisplay = document.getElementById('word-count');
    const wordLimit = 1400;

    function updateWordCount() {
        const text = editor.innerText || "";
        const words = text.trim().match(/\S+/g);
        const count = words ? words.length : 0;
        wordCountDisplay.innerText = count;

        if (count > wordLimit) {
            wordCountDisplay.parentElement.style.color = "#ef4444";
            wordCountDisplay.parentElement.style.fontWeight = "bold";
        } else {
            wordCountDisplay.parentElement.style.color = "#6b7280";
            wordCountDisplay.parentElement.style.fontWeight = "normal";
        }
    }

    editor.addEventListener('input', updateWordCount);
    window.addEventListener('DOMContentLoaded', updateWordCount);
</script>

</body>
</html>
